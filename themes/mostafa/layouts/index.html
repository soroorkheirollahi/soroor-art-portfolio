{{ define "main" }}
<div class="main-content-wrapper">
  <!-- استفاده از سینتکس صحیح پایپ‌لاین برای Chunk -->
  {{ range .Site.RegularPages | collections.Chunk 4 }}
    <div class="horizontal-gallery-container">
      <div class="grid-4-container">
        {{ range . }}
          <a href="{{ .RelPermalink }}" class="grid-item">
            {{ if .Params.image }}
              <img src="{{ .Params.image }}" alt="{{ .Title }}" class="grid-image">
            {{ else }}
              <div class="no-image">بدون عکس</div>
            {{ end }}
          </a>
        {{ end }}
      </div>
    </div>
  {{ end }}
</div>

<style>
  .main-content-wrapper {
    margin-left: 320px !important; 
    padding-top: 40px !important;
    padding-bottom: 50px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    box-sizing: border-box !important;
  }

  .horizontal-gallery-container {
    width: 100% !important;
    max-width: 1200px !important; 
    height: 750px !important; 
    background-color: #2a2a2a !important; 
    border: 1px solid #444 !important;
    border-radius: 12px !important;
    padding: 20px !important; 
    box-sizing: border-box !important;
    margin-bottom: 40px !important; 
  }

  .grid-4-container {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    grid-template-rows: repeat(2, 1fr) !important;
    gap: 15px !important;
    width: 100% !important;
    height: 100% !important;
  }

  .grid-item {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 8px !important;
    overflow: hidden !important;
    transition: transform 0.3s !important;
  }
  
  .grid-item:hover {
    transform: scale(1.02) !important;
    box-shadow: 0 0 15px rgba(249, 115, 22, 0.5) !important;
  }

  .grid-image {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  @media (max-width: 1024px) {
    .main-content-wrapper { margin-left: 0 !important; padding: 20px !important; }
    .horizontal-gallery-container { height: auto !important; min-height: 500px !important; }
  }
  @media (max-width: 600px) {
    .grid-4-container { grid-template-columns: 1fr !important; grid-template-rows: auto !important; }
    .grid-item { height: 300px !important; }
  }
</style>
{{ end }}
