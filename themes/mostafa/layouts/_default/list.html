{{ define "main" }}
<div class="main-content-wrapper">
  <!-- حلقه اصلی: عکس‌ها را ۴ تا ۴ تا جدا می‌کند -->
  {{ range .Pages.Chunk 4 }}
    <div class="horizontal-gallery-container">
      <div class="grid-4-container">
        <!-- حلقه داخلی: ۴ عکس داخل هر کادر -->
        {{ range . }}
          <a href="{{ .RelPermalink }}" class="grid-item">
            {{ if .Params.image }}
              <img src="{{ .Params.image }}" alt="{{ .Title }}" class="grid-image">
            {{ else }}
              <div class="no-image">بدون عکس</div>
            {{ end }}
          </a>
        {{ end }}
      </div>
    </div>
  {{ end }}
</div>

<style>
  /* ۱. تنظیم فضای کل صفحه */
  .main-content-wrapper {
    margin-left: 320px !important; /* فاصله از سایدبار */
    padding-top: 40px !important;
    padding-bottom: 50px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important; /* وسط چین کردن کادرها */
    box-sizing: border-box !important;
  }

  /* ۲. کادر مستطیل افقی (برای هر ۴ عکس) */
  .horizontal-gallery-container {
    width: 100% !important;
    max-width: 800px !important; /* عرض ۸۰۰ پیکسل */
    height: 500px !important; /* ارتفاع ۵۰۰ پیکسل */
    background-color: #2a2a2a !important; /* کادر طوسی */
    border: 1px solid #444 !important;
    border-radius: 12px !important;
    padding: 15px !important;
    box-sizing: border-box !important;
    margin-bottom: 30px !important; /* فاصله بین کادرهای ۴ تایی */
  }

  /* ۳. شبکه ۴ خانه‌ای داخل هر کادر */
  .grid-4-container {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    grid-template-rows: repeat(2, 1fr) !important;
    gap: 15px !important;
    width: 100% !important;
    height: 100% !important;
  }

  /* ۴. استایل هر عکس */
  .grid-item {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 8px !important;
    overflow: hidden !important;
    transition: transform 0.3s !important;
  }
  
  .grid-item:hover {
    transform: scale(1.02) !important;
    box-shadow: 0 0 15px rgba(249, 115, 22, 0.5) !important;
  }

  .grid-image {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
  }

  /* واکنش‌گرا برای موبایل */
  @media (max-width: 1024px) {
    .main-content-wrapper {
      margin-left: 0 !important;
      padding-left: 15px !important;
      padding-right: 15px !important;
    }
    .horizontal-gallery-container {
      height: auto !important;
      min-height: 400px !important;
    }
  }
  
  @media (max-width: 600px) {
    .grid-4-container {
      grid-template-columns: 1fr !important;
      grid-template-rows: auto !important;
    }
    .grid-item {
      height: 250px !important;
    }
  }
</style>
{{ end }}
