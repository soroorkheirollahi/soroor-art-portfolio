backend:
  name: github
  repo: soroorkheirollahi/soroor-art-portfolio
  branch: main
  base_url: https://sveltia-auth.soroorkheyrollahi.workers.dev

media_folder: "static/images/uploads"
public_folder: "images/uploads"

collections:
  - name: "paintings"
    label: "Paintings (نقاشی‌ها)"
    folder: "content/en/posts"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "YouTube Link", name: "youtube", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "sculptures"
    label: "Sculptures (مجسمه‌ها)"
    folder: "content/en/sculptures"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "YouTube Link", name: "youtube", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages (صفحات سایت)"
    files:
      - name: "resume_en"
        label: "Resume (رزومه انگلیسی)"
        file: "content/en/resume.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Date", name: "date", widget: "datetime" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "resume_fa"
        label: "رزومه (فارسی)"
        file: "content/fa/resume.md"
        fields:
          - { label: "عنوان", name: "title", widget: "string" }
          - { label: "تاریخ", name: "date", widget: "datetime" }
          - { label: "متن", name: "body", widget: "markdown" }
      - name: "about_en"
        label: "About (درباره من انگلیسی)"
        file: "content/en/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "About Me" }
          - { label: "Date", name: "date", widget: "datetime" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "about_fa"
        label: "درباره من (فارسی)"
        file: "content/fa/about.md"
        fields:
          - { label: "عنوان", name: "title", widget: "string", default: "درباره من" }
          - { label: "تاریخ", name: "date", widget: "datetime" }
          - { label: "متن", name: "body", widget: "markdown" }
      - name: "contact_en"
        label: "Contact (تماس انگلیسی)"
        file: "content/en/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Contact" }
          - { label: "Date", name: "date", widget: "datetime" }
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "contact_fa"
        label: "تماس با من (فارسی)"
        file: "content/fa/contact.md"
        fields:
          - { label: "عنوان", name: "title", widget: "string", default: "تماس با من" }
          - { label: "تاریخ", name: "date", widget: "datetime" }
          - { label: "متن", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Settings (تنظیمات سایدبار)"
    files:
      - name: "sidebar"
        label: "Sidebar Info (عکس هنرمند و تبلیغات)"
        file: "data/sidebar.json"
        fields:
          - { label: "Artist Profile Image", name: "profile_image", widget: "image" }
          - { label: "Advertisement Image", name: "ad_image", widget: "image", required: false }
          - { label: "Advertisement Link", name: "ad_link", widget: "string", required: false }
