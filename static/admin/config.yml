backend:
  name: github
  repo: soroorkheirollahi/soroor-art-portfolio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  # بخش اول: آثار انگلیسی
  - name: "artworks_en"
    label: "Works (English)"
    folder: "content/en/posts"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "YouTube Link", name: "youtube", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  # بخش دوم: آثار فارسی
  - name: "artworks_fa"
    label: "آثار هنری (فارسی)"
    folder: "content/fa/posts"
    create: true
    fields:
      - { label: "عنوان", name: "title", widget: "string" }
      - { label: "تاریخ", name: "date", widget: "datetime" }
      - { label: "عکس اثر", name: "image", widget: "image", required: false }
      - { label: "لینک یوتیوب", name: "youtube", widget: "string", required: false }
      - { label: "توضیحات", name: "body", widget: "markdown" }

  # بخش سوم: تنظیمات سایدبار
  - name: "settings"
    label: "تنظیمات سایت (عکس و تبلیغات)"
    files:
      - name: "sidebar"
        label: "اطلاعات سایدبار"
        file: "content/settings/sidebar.json"
        fields:
          - { label: "عکس هنرمند", name: "profile_image", widget: "image" }
          - { label: "عکس تبلیغاتی (زیر عکس هنرمند)", name: "ad_image", widget: "image", required: false }
          - { label: "لینک تبلیغات", name: "ad_link", widget: "string", required: false }