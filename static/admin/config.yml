backend:
  name: github
  repo: soroorkheirollahi/soroor-art-portfolio
  branch: main
  base_url: https://sveltia-auth.soroorkheyrollahi.workers.dev

media_folder: "static/images/uploads"
public_folder: "images/uploads"

collections:
  - name: "paintings"
    label: "Paintings (نقاشی‌ها)"
    folder: "content/en/posts"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "YouTube Link", name: "youtube", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "sculptures"
    label: "Sculptures (مجسمه‌ها)"
    folder: "content/en/sculptures"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "YouTube Link", name: "youtube", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }
